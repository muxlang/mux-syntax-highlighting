name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint_workflows:
    # actionlint plus its built-in shellcheck integration (active once
    # shellcheck is on PATH, which it is on this image) - context #29's
    # lint-the-pipeline-itself ask. Ungated: a workflow-only change is exactly
    # what this exists to catch, and it is cheap enough not to need a filter.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh

  syntax_quality:
    name: Syntax Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: JavaScript quality
        run: npm ci --ignore-scripts && npm run lint && npm run format:check && npm run samples && node scripts/check-parity.js && node scripts/build-editor-support.js --check
      - name: Build and verify VSCode package
        run: npm run package:vscode && npm run verify:vscode-package
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mux-vscode-extension
          path: dist/language-mux.vsix
          if-no-files-found: error

  vscode_client_tests:
    name: VSCode Client Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:vscode-client
      - name: Upload VSCode client coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-client-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  syntax_checks:
    name: Syntax Checks
    needs: [syntax_quality, vscode_client_tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require syntax quality and client tests
        env:
          QUALITY_RESULT: ${{ needs.syntax_quality.result }}
          TEST_RESULT: ${{ needs.vscode_client_tests.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success

  sonarqube:
    name: SonarQube
    needs: vscode_client_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: Download VSCode client coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-client-coverage-lcov
          path: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free SonarCloud plan locks every project to the built-in "Sonar way"
      # gate, which only fails on rating/coverage thresholds and lets new issues
      # (e.g. a single code smell) through. Enforce "zero new issues" ourselves:
      # the scan above waits for analysis (sonar.qualitygate.wait), so the count
      # is queryable here.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-syntax-highlighting "${{ github.event.pull_request.number }}"
