name: Publish VSCode extension

on:
  push:
    branches:
      - main
    paths:
      - 'textmate-mux/vscode-language-mux/**'
      - 'shared/syntax-matrix.json'
      - 'scripts/build-editor-support.js'
      - 'scripts/generate-syntax.js'
      - 'scripts/package-vscode.js'
      - 'scripts/verify-vsix.js'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package (for example v0.13.0)
        required: true
        type: string
      destination:
        description: Where to publish the verified VSIX
        required: true
        default: none
        type: choice
        options:
          - none
          - marketplace
          - open-vsx
          - both

permissions:
  contents: read

jobs:
  check_auto_publish_version:
    name: Check automatic publish version
    if: github.event_name == 'push' && vars.VSCODE_MARKETPLACE_AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require a new Marketplace version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_FILE: textmate-mux/vscode-language-mux/package.json
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Cannot compare this push with a previous commit. Publish the first version manually, then retry with a normal main-branch update." >&2
            exit 1
          fi

          old_version=$(git show "$BEFORE_SHA:$VERSION_FILE" | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(data).version));')
          new_version=$(node -p "require('./$VERSION_FILE').version")
          node - "$old_version" "$new_version" <<'NODE'
          const [oldVersion, newVersion] = process.argv.slice(2);
          const parse = value => {
            if (!/^\d+\.\d+\.\d+$/.test(value)) {
              throw new Error(`Expected a stable X.Y.Z extension version, got ${value}`);
            }
            return value.split('.').map(Number);
          };
          const oldParts = parse(oldVersion);
          const newParts = parse(newVersion);
          const increased = newParts.some((part, index) =>
            part > oldParts[index] && newParts.slice(0, index).every((prefix, prefixIndex) => prefix === oldParts[prefixIndex]),
          );
          if (!increased) {
            throw new Error(`Extension version must increase from ${oldVersion} to a new stable version. Update ${process.env.VERSION_FILE} in the same change that updates the extension.`);
          }
          NODE
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

  package_auto_publish:
    name: Build and verify automatic publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Run extension checks
        run: npm run check
      - name: Build and verify VSIX
        run: |
          npm run package:vscode
          npm run verify:vscode-package
          (cd dist && sha256sum language-mux.vsix > language-mux.vsix.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mux-vscode-auto-${{ github.sha }}
          path: dist/language-mux.vsix*
          if-no-files-found: error
          retention-days: 30

  publish_auto_marketplace:
    name: Publish versioned change to Visual Studio Marketplace
    if: github.event_name == 'push' && vars.VSCODE_MARKETPLACE_AUTO_PUBLISH == 'true'
    needs:
      - check_auto_publish_version
      - package_auto_publish
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked package dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mux-vscode-auto-${{ github.sha }}
          path: dist
      - name: Verify artifact digest
        run: cd dist && sha256sum --check language-mux.vsix.sha256
      - name: Publish verified VSIX
        working-directory: textmate-mux/vscode-language-mux
        run: node ../../node_modules/@vscode/vsce/vsce publish --oidc --packagePath ../../dist/language-mux.vsix

  package:
    name: Package and verify release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check workflow ref and release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$WORKFLOW_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Workflow ref is $WORKFLOW_REF; select release tag $RELEASE_TAG as the workflow ref." >&2
            exit 1
          fi
          version=$(node -p "require('./textmate-mux/vscode-language-mux/package.json').version")
          test "$RELEASE_TAG" = "v$version"
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Reuse or create the durable VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Mux VSCode extension $RELEASE_TAG" \
              --notes "Verified VSIX artifact for $RELEASE_TAG." \
              || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          read_release_asset_state() {
            local asset_names
            asset_names=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]')
            has_vsix=$(jq -r 'index("language-mux.vsix") != null' <<< "$asset_names")
            has_digest=$(jq -r 'index("language-mux.vsix.sha256") != null' <<< "$asset_names")
            has_build_info=$(jq -r 'index("language-mux.build.json") != null' <<< "$asset_names")
          }

          download_release_assets() {
            rm -f dist/language-mux.vsix dist/language-mux.vsix.sha256 dist/language-mux.build.json
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern language-mux.vsix \
              --pattern language-mux.vsix.sha256 \
              --pattern language-mux.build.json \
              --dir dist
          }

          wait_for_release_assets() {
            local attempt=0
            while [[ "$attempt" -lt 12 ]]; do
              attempt=$((attempt + 1))
              sleep 5
              read_release_asset_state
              if [[ "$has_vsix" == true && "$has_digest" == true && "$has_build_info" == true ]] && download_release_assets; then
                return 0
              fi
            done
            return 1
          }

          read_release_asset_state

          mkdir -p dist
          if [[ "$has_vsix" == true && "$has_digest" == true && "$has_build_info" == true ]]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern language-mux.vsix \
              --pattern language-mux.vsix.sha256 \
              --pattern language-mux.build.json \
              --dir dist
          elif [[ "$has_vsix" == false && "$has_digest" == false && "$has_build_info" == false ]]; then
            npm run package:vscode
            npm run verify:vscode-package
            actual_digest=$(sha256sum dist/language-mux.vsix | cut -d ' ' -f 1)
            (cd dist && sha256sum language-mux.vsix > language-mux.vsix.sha256)
            source_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
            version=$(node -p "require('./textmate-mux/vscode-language-mux/package.json').version")
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg release_tag "$RELEASE_TAG" \
              --arg source_commit "$source_commit" \
              --arg version "$version" \
              --arg sha256 "$actual_digest" \
              '{repository: $repository, release_tag: $release_tag, source_commit: $source_commit, version: $version, sha256: $sha256}' \
              > dist/language-mux.build.json
            if ! gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              dist/language-mux.vsix \
              dist/language-mux.vsix.sha256 \
              dist/language-mux.build.json; then
              echo "Another run may have uploaded the release assets; waiting for its complete asset set."
              if ! wait_for_release_assets; then
                echo "No complete, downloadable VSIX asset set appeared for $RELEASE_TAG." >&2
                exit 1
              fi
            fi
          else
            echo "Release $RELEASE_TAG has a partial VSIX asset set. Waiting for another package job to finish." >&2
            if ! wait_for_release_assets; then
              read_release_asset_state
              if [[ "$has_vsix" == true && "$has_digest" == true && "$has_build_info" == false ]]; then
                echo "Release $RELEASE_TAG has legacy VSIX assets without source metadata." >&2
                echo "Remove language-mux.vsix and language-mux.vsix.sha256, then rerun with destination 'none' to build a verified release asset." >&2
              else
                echo "No complete VSIX asset set appeared for $RELEASE_TAG." >&2
              fi
              exit 1
            fi
          fi

          (cd dist && sha256sum --check language-mux.vsix.sha256)
          actual_digest=$(sha256sum dist/language-mux.vsix | cut -d ' ' -f 1)
          source_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          version=$(node -p "require('./textmate-mux/vscode-language-mux/package.json').version")
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$source_commit" \
            --arg version "$version" \
            --arg sha256 "$actual_digest" \
            '.repository == $repository and .release_tag == $release_tag and .source_commit == $source_commit and .version == $version and .sha256 == $sha256' \
            dist/language-mux.build.json >/dev/null; then
            echo "Release $RELEASE_TAG has VSIX metadata that does not match this tag." >&2
            echo "Remove all three language-mux release assets, then rerun with destination 'none'." >&2
            exit 1
          fi
          npm run verify:vscode-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mux-vscode-release-${{ inputs.release_tag }}
          path: dist/language-mux.vsix*
          if-no-files-found: error
          retention-days: 30

  publish_marketplace:
    name: Publish to Visual Studio Marketplace
    if: github.event_name == 'workflow_dispatch' && (inputs.destination == 'marketplace' || inputs.destination == 'both')
    needs: package
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mux-vscode-release-${{ inputs.release_tag }}
          path: dist
      - name: Verify artifact digest
        run: cd dist && sha256sum --check language-mux.vsix.sha256
      - name: Publish verified VSIX
        working-directory: textmate-mux/vscode-language-mux
        run: node ../../node_modules/@vscode/vsce/vsce publish --oidc --packagePath ../../dist/language-mux.vsix

  publish_open_vsx:
    name: Publish to Open VSX
    if: github.event_name == 'workflow_dispatch' && (inputs.destination == 'open-vsx' || inputs.destination == 'both')
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked Open VSX CLI
        run: npm ci --prefix .github/ovsx-cli --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mux-vscode-release-${{ inputs.release_tag }}
          path: dist
      - name: Verify artifact digest
        run: cd dist && sha256sum --check language-mux.vsix.sha256
      - name: Publish verified VSIX
        run: |
          .github/ovsx-cli/node_modules/.bin/ovsx publish --trusted-publishing dist/language-mux.vsix
