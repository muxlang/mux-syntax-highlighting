name: Publish VSCode extension

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package (for example v0.13.0)
        required: true
        type: string
      destination:
        description: Build a VSIX for manual upload or publish to Open VSX
        required: true
        default: none
        type: choice
        options:
          - none
          - open-vsx

permissions:
  contents: read

jobs:
  package:
    name: Package and verify release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: vscode-release-assets-${{ inputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check workflow ref and release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$WORKFLOW_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Workflow ref is $WORKFLOW_REF; select release tag $RELEASE_TAG as the workflow ref." >&2
            exit 1
          fi
          version=$(node -p "require('./textmate-mux/vscode-language-mux/package.json').version")
          test "$RELEASE_TAG" = "v$version"
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Reuse or create the durable VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash scripts/ci/manage-vscode-release-assets.sh tagged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mux-vscode-release-${{ inputs.release_tag }}
          path: dist/language-mux.vsix*
          if-no-files-found: error
          retention-days: 30

  publish_open_vsx:
    name: Publish to Open VSX
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'open-vsx'
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked Open VSX CLI
        run: npm ci --prefix .github/ovsx-cli --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mux-vscode-release-${{ inputs.release_tag }}
          path: dist
      - name: Verify artifact digest
        run: cd dist && sha256sum --check language-mux.vsix.sha256
      - name: Check Open VSX token
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          if [[ -z "$OVSX_PAT" ]]; then
            echo "::error::Set OPEN_VSX_PAT in the open-vsx GitHub Actions environment."
            exit 1
          fi
      - name: Publish verified VSIX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          .github/ovsx-cli/node_modules/.bin/ovsx publish dist/language-mux.vsix
