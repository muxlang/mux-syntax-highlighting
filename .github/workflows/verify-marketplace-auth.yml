name: Verify VS Code Marketplace authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_marketplace_auth:
    name: Verify Azure identity and publisher access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked publishing tools
        run: npm ci --ignore-scripts
      - name: Authenticate and verify Marketplace publisher
        uses: ./.github/actions/marketplace-auth
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
